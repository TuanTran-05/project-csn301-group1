ead</text><path d="M230 108 L230 118 L286 118 L286 134" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="234" y="134" width="104" height="28" rx="6" fill="#eef2f8" stroke="#222" stroke-width="1.2" /><text x="286" y="152.375" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">configure</text><path d="M230 108 L230 118 L398 118 L398 134" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="346" y="134" width="104" height="28" rx="6" fill="#eef2f8" stroke="#222" stroke-width="1.2" /><text x="398" y="152.375" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">design</text><path d="M62 172 L62 182" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="10" y="182" width="104" height="40" rx="6" fill="#fff" stroke="#222" stroke-width="1.2" /><text x="62" y="199.24" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#111">Answer with</text><text x="62" y="212.81" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">topology context</text><path d="M62 222 L62 232" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="10" y="232" width="104" height="40" rx="6" fill="#fff" stroke="#222" stroke-width="1.2" /><text x="62" y="249.24" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#111">No device</text><text x="62" y="262.81" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">access</text><path d="M174 172 L174 182" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="122" y="182" width="104" height="40" rx="6" fill="#fff" stroke="#222" stroke-width="1.2" /><text x="174" y="199.24" font-family="Arial, H