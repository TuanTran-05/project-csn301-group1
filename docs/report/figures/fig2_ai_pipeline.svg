chor="middle" fill="#111">validate → undo</text><path d="M398 272 L398 282" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="346" y="282" width="104" height="40" rx="6" fill="#e9f4ea" stroke="#222" stroke-width="1.2" /><text x="398" y="299.23999999999995" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#111">Proposal; retry</text><text x="398" y="312.80999999999995" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#111">≤ 2 on error</text><rect x="10" y="352" width="440" height="36" rx="6" fill="#fbe9e7" stroke="#222"/><text x="230" y="366" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Backend decides: role, project scope, allowlist, risk, approval</text><text x="230" y="381" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">The model never opens SSH and never sees credentials or management IPs</text></svg>