<svg xmlns="http://www.w3.org/2000/svg" width="460" height="586" viewBox="0 0 460 586"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs><rect width="460" height="586" fill="#fff"/><rect x="110" y="8" width="240" height="38" rx="6" fill="#fbf3df" stroke="#222" stroke-width="1.2" /><text x="230" y="24.12" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Proposal</text><text x="230" y="38.28" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">AI chat · canvas · manual · restore</text><path d="M230 46 L230 60" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="110" y="60" width="240" height="38" rx="6" fill="#fff" stroke="#222" stroke-width="1.2" /><text x="230" y="76.12" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Policy check</text><text x="230" y="90.28" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">forbidden / unknown → reject</text><path d="M230 98 L230 112" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="110" y="112" width="240" height="38" rx="6" fill="#fff" stroke="#222" stroke-width="1.2" /><text x="230" y="128.12" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Risk classification (backend)</text><text x="230" y="142.28" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">Low / High, never from AI or user</text><path d="M230 150 L230 164" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="110" y="164" width="240" height="38" rx="6" fill="#eef2f8" stroke="#222" stroke-width="1.2" /><text x="230" y="180.11999999999998" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Preview</text><text x="230" y="194.27999999999997" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">frozen targets, commands, verification</text><path d="M230 202 L230 216" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="110" y="216" width="240" height="38" rx="6" fill="#eef2f8" stroke="#222" stroke-width="1.2" /><text x="230" y="232.11999999999998" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Approval</text><text x="230" y="246.27999999999997" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">Smart Approval (Low) or Teacher/Admin</text><path d="M230 254 L230 268" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="110" y="268" width="240" height="38" rx="6" fill="#eef2f8" stroke="#222" stroke-width="1.2" /><text x="230" y="284.12" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Typed confirmation (High)</text><text x="230" y="298.28000000000003" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">exact hostname or CONFIRM ALL</text><path d="M230 306 L230 320" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="110" y="320" width="240" height="38" rx="6" fill="#fff" stroke="#222" stroke-width="1.2" /><text x="230" y="336.12" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Pre-deploy recheck</text><text x="230" y="350.28000000000003" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">grant, digest, baseline, window, lease</text><path d="M230 358 L230 372" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="110" y="372" width="240" height="38" rx="6" fill="#e9f4ea" stroke="#222" stroke-width="1.2" /><text x="230" y="395.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Backup running-config</text><path d="M230 410 L230 424" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="110" y="424" width="240" height="38" rx="6" fill="#e9f4ea" stroke="#222" stroke-width="1.2" /><text x="230" y="447.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Apply over SSH</text><path d="M230 462 L230 476" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="110" y="476" width="240" height="38" rx="6" fill="#e9f4ea" stroke="#222" stroke-width="1.2" /><text x="230" y="499.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Verify (read-only checks)</text><path d="M110 495 L90 495 L90 532" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="36" y="532" width="108" height="46" rx="6" fill="#e9f4ea" stroke="#222" stroke-width="1.2" /><text x="90" y="552.12" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">success</text><text x="90" y="566.28" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">→ checkpoint</text><path d="M350 495 L396 495 L396 532" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><rect x="340" y="532" width="110" height="46" rx="6" fill="#fbe9e7" stroke="#222" stroke-width="1.2" /><text x="395" y="552.12" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">failed /</text><text x="395" y="566.28" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">partial_success</text><rect x="160" y="532" width="140" height="46" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.2" /><text x="230" y="552.12" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Audit log</text><text x="230" y="566.28" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">(secrets redacted)</text><path d="M 36 555 L 24 555 L 24 183 L 110 183" fill="none" stroke="#222" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="14" y="369" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" transform="rotate(-90 14 369)">Undo/Redo: config diff → new preview</text><path d="M350 79 L446 79" fill="none" stroke="#222" stroke-width="1.3"  marker-end="url(#ah)"/><text x="446" y="73" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" font-style="italic" text-anchor="end" fill="#111">reject</text></svg>