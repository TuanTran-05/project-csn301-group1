[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-copilot"
version = "0.1.0"
description = "AI-assisted network management backend for a PNETLab topology"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "Flask-Migrate>=4.0",
    "Flask-JWT-Extended>=4.6",
    "Flask-Limiter>=3.5",
    "SQLAlchemy>=2.0",
    # Paramiko 5.0 deleted the SHA-1 based key-exchange implementations
    # (diffie-hellman-group14-sha1 / group-exchange-sha1) outright, not just
    # deprioritized them. The Cisco IOSv/IOSv-L2 images in this lab only speak
    # those, confirmed against a real device: <5 keeps the last version with a
    # working implementation, not just the algorithm's name in a list.
    "paramiko>=3.4,<5",
    "APScheduler>=3.10",
    "pydantic>=2.6",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Optional alternative to the default Gemini provider.
anthropic = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["network_copilot"]
