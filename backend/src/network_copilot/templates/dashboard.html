<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Tool — Dashboard</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body x-data="dashboardApp()" @account-session-updated.window="token = $event.detail.access_token; currentUser = $event.detail.user">

  <section class="login-screen" x-show="!currentUser" x-cloak>
    <form class="login-form" @submit.prevent="login()">
      <h1>AI Tool</h1>
      <label>
        Tên đăng nhập
        <input type="text" x-model="loginForm.username" required autocomplete="username" />
      </label>
      <label>
        Mật khẩu
        <input type="password" x-model="loginForm.password" required autocomplete="current-password" />
      </label>
      <p class="error-text" x-show="loginError" x-text="loginError"></p>
      <button type="submit">Đăng nhập</button>
    </form>
  </section>

  <div class="app-shell" x-show="currentUser" x-cloak>
    <header class="top-bar">
      <span class="app-title">AI Tool</span>
      <nav class="top-bar-nav" aria-label="Điều hướng chính">
        <div class="top-bar-project-slot">
          <label class="project-switch" x-show="projects.length" x-cloak>
            <span class="sr-only">Project</span>
            <select class="project-select" :value="currentProjectId" @change="selectProject(Number($event.target.value))">
              <template x-for="project in projects" :key="project.id">
                <option :value="project.id" :selected="project.id === currentProjectId" x-text="project.name"></option>
              </template>
            </select>
          </label>
        </div>
        <a class="nav-link nav-projects" href="/projects">Projects</a>
        <a class="nav-link nav-topology"
           :href="currentProjectId ? '/projects?project_id=' + currentProjectId + '&tab=topology' : '/projects?tab=topology'">Sơ đồ mạng</a>
        <a class="nav-link nav-dashboard" href="/dashboard" aria-current="page">Dashboard</a>
        <a class="nav-link nav-chat" href="/">Chat</a>
        {% include "_account_menu.html" %}
        <button class="logout-btn" @click="logout()">Đăng xuất</button>
      </nav>
    </header>

    <p class="dashboard-error" x-show="lastError" x-cloak>
      Không tải được dữ liệu mới nhất lúc <span x-text="lastError"></span>
    </p>

    <p class="project-empty" x-show="noProject" x-cloak>Chưa có project để hiển thị. <a href="/projects">Mở Projects</a> hoặc nhờ quản trị viên chia sẻ project.</p>
    <template x-if="summary">
    <div class="dashboard-grid">
      <section class="dashboard-panel">
        <h2>Trạng thái thiết bị</h2>
        <table class="dashboard-table">
          <thead>
            <tr><th>Vai trò</th><th>Online</th><th>Offline</th><th>Unknown</th><th>Tổng</th></tr>
          </thead>
          <tbody>
            <template x-for="[role, counts] in Object.entries(summary.devices.by_role)" :key="role">
              <tr>
                <td x-text="role"></td>
                <td><span class="status-dot status-online"></span><span x-text="counts.online"></span></td>
                <td><span class="status-dot status-offline"></span><span x-text="counts.offline"></span></td>
                <td><span class="status-dot status-unknown"></span><span x-text="counts.unknown"></span></td>
                <td x-text="counts.total"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </section>

      <section class="dashboard-panel">
        <h2>Tình trạng OSPF</h2>
        <p class="dashboard-hint" x-show="allOspfNoData()">
          Chưa có dữ liệu OSPF — kiểm tra MONITORING_ENABLED trên máy chủ.
        </p>
        <template x-for="entry in summary.ospf" :key="entry.device_id">
          <div class="ospf-entry">
            <div class="ospf-entry-header">
              <strong x-text="entry.hostname"></strong>
              <span class="health-pill" :class="'health-' + entry.health" x-text="entry.health"></span>
              <span class="ospf-count" x-text="entry.neighbor_count + ' neighbor(s)'"></span>
            </div>
            <ul class="ospf-neighbor-list" x-show="entry.neighbors.length">
              <template x-for="neighbor in entry.neighbors" :key="neighbor.neighbor_id + neighbor.interface">
                <li>
                  <code x-text="neighbor.neighbor_id"></code>
                  <span x-text="neighbor.state"></span>
                  <span x-text="neighbor.interface"></span>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </section>

      <section class="dashboard-panel">
        <h2>Thay đổi</h2>
        <h3>Đang chờ duyệt</h3>
        <ul class="dashboard-list">
          <template x-for="change in summary.changes.pending_approval" :key="'pending-' + change.id">
            <li>
              <a href="/">
                <span x-text="change.device.hostname"></span>
                <span class="risk-pill" x-text="change.risk_level"></span>
              </a>
            </li>
          </template>
        </ul>
        <h3>Gần đây</h3>
        <ul class="dashboard-list">
          <template x-for="change in summary.changes.recent" :key="'recent-' + change.id">
            <li>
              <a href="/">
                <span x-text="change.device.hostname"></span>
                <span class="status-pill" x-text="change.status"></span>
              </a>
            </li>
          </template>
        </ul>
      </section>

      <section class="dashboard-panel">
        <h2>Nhật ký hoạt động</h2>
        <p class="dashboard-hint">Thời gian Việt Nam (UTC+7). Nhật ký được lưu trên máy chủ và giữ lại sau khi đăng xuất.</p>
        <template x-for="group in activityGroups" :key="group.key">
          <details class="audit-day">
            <summary class="audit-day-summary">
              <span x-text="group.label"></span>
              <span class="audit-count" x-text="`${group.events.length} hoạt động`"></span>
            </summary>
            <ul class="dashboard-list audit-event-list">
              <template x-for="event in group.events" :key="event.id">
                <li class="audit-event">
                  <div class="audit-event-heading">
                    <time class="audit-time" x-text="formatActivityTime(event.created_at)"></time>
                    <span x-text="event.username || (event.user_id ? 'Người dùng #' + event.user_id : 'Hệ thống')"></span>
                    <strong x-text="activityActionLabel(event.action)"></strong>
                    <span class="result-status" :class="'result-' + (event.result === 'failure' ? 'failed' : event.result)" x-text="activityResultLabel(event.result)"></span>
                  </div>
                  <p class="audit-event-message" x-show="event.message" x-text="event.message"></p>
                  <pre class="audit-event-details" x-show="event.details" x-text="formatActivityDetails(event.details)"></pre>
                </li>
              </template>
            </ul>
          </details>
        </template>
        <p class="dashboard-hint" x-show="!activityEvents.length && !activityLoading && !activityError">Chưa có hoạt động nào được ghi lại.</p>
        <p class="error-text" x-show="activityError" x-text="activityError"></p>
        <button class="audit-load-more" type="button" x-show="activityHasMore" :disabled="activityLoading" @click="loadMoreActivity()"
                x-text="activityLoading ? 'Đang tải…' : 'Tải lịch sử cũ hơn'"></button>
      </section>
    </div>
    </template>
  </div>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/account_menu.js') }}" defer></script>
  <script src="{{ url_for('static', filename='vendor/alpine.min.js') }}" defer></script>
</body>
</html>
