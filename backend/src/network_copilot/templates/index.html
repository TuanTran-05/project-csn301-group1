<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Network Copilot</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body x-data="app()">

  <section class="login-screen" x-show="!currentUser" x-cloak>
    <form class="login-form" @submit.prevent="login()">
      <h1>Network Copilot</h1>
      <label>
        Tên đăng nhập
        <input type="text" x-model="loginForm.username" required autocomplete="username" />
      </label>
      <label>
        Mật khẩu
        <input type="password" x-model="loginForm.password" required autocomplete="current-password" />
      </label>
      <p class="error-text" x-show="loginError" x-text="loginError"></p>
      <button type="submit">Đăng nhập</button>
    </form>
  </section>

  <div class="app-shell" x-show="currentUser" x-cloak>
    <header class="top-bar">
      <span class="app-title">Network Copilot</span>
      <a class="nav-link" href="/dashboard">Dashboard</a>
      <span class="user-badge">
        <span x-text="currentUser && currentUser.username"></span>
        <span class="role-pill" x-text="currentUser && currentUser.role"></span>
      </span>
      <button class="logout-btn" @click="logout()">Đăng xuất</button>
    </header>
    <div class="main-grid">
      <aside class="sidebar devices-panel">
        <h2>Thiết bị</h2>
        <ul>
          <template x-for="device in devices" :key="device.id">
            <li>
              <span
                class="status-dot"
                :class="'status-' + device.status"
                aria-hidden="true"
              ></span>
              <span x-text="device.hostname"></span>
              <span class="device-role" x-text="device.role"></span>
              <span class="device-status" x-text="device.status"></span>
            </li>
          </template>
        </ul>
      </aside>
      <main class="chat-panel">
        <div class="chat-log" x-ref="chatLog">
          <template x-for="message in messages" :key="message.id">
            <div class="bubble" :class="'bubble-' + message.role">
              <div class="bubble-meta">
                <span x-text="message.username || 'AI'"></span>
                <span x-text="new Date(message.created_at).toLocaleTimeString('vi-VN')"></span>
              </div>
              <div class="bubble-content" x-text="message.content"></div>

              <template x-if="message.role === 'assistant' && message.payload && Array.isArray(message.payload.results)">
                <div class="operational-results">
                  <div class="operational-heading">
                    <span class="operational-label">Target</span>
                    <strong x-text="message.payload.device || 'Unknown device'"></strong>
                    <span class="intent-pill" x-text="message.payload.intent"></span>
                  </div>
                  <p
                    class="operational-analysis"
                    x-show="message.payload.analysis"
                    x-text="message.payload.analysis"
                  ></p>
                  <div class="result-list">
                    <template x-for="(result, resultIndex) in message.payload.results" :key="result.command + '-' + resultIndex">
                      <div class="result-row">
                        <div class="result-heading">
                          <code x-text="result.command"></code>
                          <span
                            class="result-status"
                            :class="'result-' + result.status"
                            x-text="result.status"
                          ></span>
                          <span
                            class="result-duration"
                            x-text="result.duration_ms != null ? result.duration_ms + ' ms' : ''"
                          ></span>
                        </div>
                        <template x-if="resultColumns(result).length === 0">
                          <pre x-text="result.output || 'No output returned.'"></pre>
                        </template>
                        <template x-if="resultColumns(result).length > 0">
                          <div class="result-table-wrap">
                            <table class="result-table">
                              <thead>
                                <tr>
                                  <template x-for="column in resultColumns(result)" :key="column">
                                    <th x-text="resultCellLabel(column)"></th>
                                  </template>
                                </tr>
                              </thead>
                              <tbody>
                                <template x-for="(row, rowIndex) in result.parsed" :key="rowIndex">
                                  <tr>
                                    <template x-for="column in resultColumns(result)" :key="column">
                                      <td x-text="resultCellValue(row, column)"></td>
                                    </template>
                                  </tr>
                                </template>
                              </tbody>
                            </table>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <template x-if="message.payload && message.payload.change && changesById[message.payload.change.id]">
                <div class="action-card" x-data="{ get change() { return changesById[message.payload.change.id]; } }">
                  <div class="action-card-header">
                    <span x-text="'Thay đổi #' + change.id"></span>
                    <span class="risk-pill" x-text="change.risk_level"></span>
                    <span class="status-pill" x-text="change.status"></span>
                  </div>
                  <div
                    class="change-target"
                    x-text="change.device && change.device.hostname ? change.device.hostname : ('Thiết bị #' + (change.device && change.device.id ? change.device.id : ''))"
                  ></div>
                  <div class="change-detail">
                    <span class="operational-label">Commands</span>
                    <pre x-text="(change.commands || []).join('\n')"></pre>
                  </div>
                  <div class="change-detail" x-show="(change.verification_commands || []).length">
                    <span class="operational-label">Verification plan</span>
                    <pre x-text="(change.verification_commands || []).join('\n')"></pre>
                  </div>
                  <div class="change-detail" x-show="change.apply_output">
                    <span class="operational-label">Apply output</span>
                    <pre x-text="change.apply_output"></pre>
                  </div>
                  <div
                    class="change-error"
                    x-show="change.error_message"
                    x-text="change.error_message"
                  ></div>
                  <template x-if="change.verification_output && Object.keys(change.verification_output).length">
                    <div class="verification-results">
                      <span class="operational-label">Final verification</span>
                      <template x-for="entry in Object.entries(change.verification_output)" :key="entry[0]">
                        <div class="verification-row">
                          <div class="result-heading">
                            <code x-text="entry[0]"></code>
                            <span
                              class="result-status"
                              :class="entry[1].passed ? 'result-success' : 'result-failed'"
                              x-text="entry[1].passed ? 'passed' : 'failed'"
                            ></span>
                          </div>
                          <div
                            class="verification-details"
                            x-text="(entry[1].details || []).join(' ')"
                          ></div>
                          <pre x-show="entry[1].output" x-text="entry[1].output"></pre>
                        </div>
                      </template>
                    </div>
                  </template>
                  <div
                    class="confirm-hostname"
                    x-show="change.status === 'approved' && change.requires_confirmation && currentUser && currentUser.role === 'ADMIN'"
                  >
                    <p class="confirm-hostname-warning">
                      Thay đổi này chứa lệnh nguy hiểm. Gõ lại chính xác tên thiết bị
                      (<code x-text="change.device && change.device.hostname"></code>)
                      để xác nhận Apply.
                    </p>
                    <input
                      type="text"
                      :placeholder="change.device && change.device.hostname"
                      x-model="confirmInputs[change.id]"
                      autocomplete="off"
                    />
                  </div>
                  <div class="action-card-buttons" x-show="currentUser && currentUser.role === 'ADMIN'">
                    <button x-show="change.status === 'pending_approval'" @click="approveChange(change.id)">Approve</button>
                    <button
                      x-show="change.status === 'approved'"
                      :disabled="change.requires_confirmation && !confirmHostnameMatches(change.id)"
                      @click="applyChange(change.id)"
                    >Apply</button>
                    <button
                      x-show="change.status === 'pending_approval' || change.status === 'approved'"
                      @click="cancelChange(change.id)"
                    >Cancel</button>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <div class="bubble bubble-assistant bubble-pending" x-show="sending" x-cloak>
            Đang xử lý...
          </div>
        </div>

        <form class="chat-input" @submit.prevent="sendMessage()">
          <label class="sr-only" for="chat-message">Tin nhắn cho Network Copilot</label>
          <input
            id="chat-message"
            type="text"
            x-model="draftMessage"
            :disabled="sending"
            placeholder="Hỏi AI về trạng thái mạng hoặc yêu cầu thay đổi cấu hình..."
          />
          <button type="submit" :disabled="sending">Gửi</button>
        </form>
      </main>
      <aside class="sidebar changes-panel">
        <h2>Thay đổi đang chờ</h2>
        <ul>
          <template x-for="change in pendingChanges" :key="change.id">
            <li>
              <div x-text="change.device ? change.device.hostname : ('Thiết bị #' + change.device_id)"></div>
              <div
                class="change-command-summary"
                x-text="(change.commands || []).join(' · ')"
              ></div>
              <span class="risk-pill" x-text="change.risk_level"></span>
              <div class="sidebar-actions" x-show="currentUser && currentUser.role === 'ADMIN'">
                <button @click="approveChange(change.id)">Approve</button>
                <button @click="cancelChange(change.id)">Cancel</button>
              </div>
            </li>
          </template>
        </ul>
      </aside>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  <script src="{{ url_for('static', filename='vendor/alpine.min.js') }}" defer></script>
</body>
</html>
