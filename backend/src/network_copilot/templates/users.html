<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Tool — Quản lý người dùng</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body x-data="usersApp()" @account-session-updated.window="token = $event.detail.access_token; currentUser = $event.detail.user">

  {% include "_login_screen.html" %}

  <div class="app-shell" x-show="currentUser" x-cloak>
    <header class="top-bar">
      <span class="app-title">AI Tool</span>
      <nav class="top-bar-nav" aria-label="Điều hướng chính">
        <div class="top-bar-project-slot" aria-hidden="true"></div>
        <a class="nav-link nav-projects" href="/projects">Projects</a>
        <a class="nav-link nav-topology" href="/projects?tab=topology">Sơ đồ mạng</a>
        <a class="nav-link nav-dashboard" href="/dashboard">Dashboard</a>
        <a class="nav-link nav-chat" href="/">Chat</a>
        {% include "_account_menu.html" %}
      </nav>
    </header>

    <main class="users-page">
      <p class="error-text" x-show="error" x-text="error"></p>
      <p class="ok-text" x-show="notice" x-text="notice"></p>

      <!-- ===== User administration ===== -->
      <section x-show="isAdmin" x-cloak>
        <div class="section-bar"><h3>Người dùng (<span x-text="users.length"></span>)</h3></div>

        <table class="data-table">
          <thead>
            <tr>
              <th>Tài khoản</th><th>Họ tên</th><th>Email</th><th>Vai trò</th>
              <th>Trạng thái</th><th>Đăng nhập gần nhất</th><th></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="user in users" :key="user.id">
              <tr :class="{ muted: !user.is_active }">
                <td><strong x-text="user.username"></strong></td>
                <td x-text="user.full_name || '—'"></td>
                <td x-text="user.email || '—'"></td>
                <td><span class="pill" x-text="user.role"></span></td>
                <td x-text="user.is_active ? 'hoạt động' : 'vô hiệu hoá'"></td>
                <td x-text="user.last_login_at ? new Date(user.last_login_at + 'Z').toLocaleString('vi-VN') : 'chưa bao giờ'"></td>
                <td class="row-actions">
                  <button type="button" @click="startEdit(user)">Sửa</button>
                  <button type="button" @click="resetPassword(user)">Đặt lại mật khẩu</button>
                  <button type="button" :class="user.is_active ? 'danger-btn' : ''"
                          @click="toggleActive(user)"
                          x-text="user.is_active ? 'Vô hiệu hoá' : 'Kích hoạt'"
                          :disabled="currentUser && user.id === currentUser.id"></button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>

        <template x-if="editing">
        <form class="card form-grid" @submit.prevent="saveEdit()">
          <h4>Sửa <span x-text="editing && editing.username"></span></h4>
          <label>Họ tên <input type="text" x-model="editing.full_name" maxlength="120" /></label>
          <label>Email <input type="text" x-model="editing.email" maxlength="254" /></label>
          <label>Vai trò
            <select x-model="editing.role">
              <option value="ADMIN">ADMIN</option>
              <option value="OPERATOR">OPERATOR</option>
              <option value="VIEWER">VIEWER</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" x-model="editing.is_active" /> Đang hoạt động</label>
          <div class="form-actions">
            <button type="submit" class="primary-btn">Lưu</button>
            <button type="button" @click="editing = null">Huỷ</button>
          </div>
          <p class="hint">Đổi vai trò hoặc vô hiệu hoá sẽ đăng xuất người đó khỏi mọi phiên đang mở.</p>
        </form>
        </template>

        <form class="card form-grid" @submit.prevent="createUser()">
          <h4>Tạo tài khoản</h4>
          <label>Tên đăng nhập <input type="text" x-model="createForm.username" required autocomplete="off" /></label>
          <label>Họ tên <input type="text" x-model="createForm.full_name" maxlength="120" /></label>
          <label>Email <input type="text" x-model="createForm.email" maxlength="254" /></label>
          <label>Mật khẩu (≥ 10 ký tự) <input type="password" x-model="createForm.password" required autocomplete="new-password" /></label>
          <label>Vai trò
            <select x-model="createForm.role">
              <option value="OPERATOR">OPERATOR — tạo project, xem, chạy lệnh đọc</option>
              <option value="VIEWER">VIEWER — chỉ xem</option>
              <option value="ADMIN">ADMIN — duyệt và áp dụng thay đổi, quản lý người dùng</option>
            </select>
          </label>
          <div class="form-actions"><button type="submit" class="primary-btn">Tạo tài khoản</button></div>
        </form>
      </section>

    </main>
  </div>

  <script defer src="{{ url_for('static', filename='js/users.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/account_menu.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/alpine.min.js') }}"></script>
</body>
</html>
